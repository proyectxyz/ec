<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control del Bot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 850px;
            margin: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .status-badge {
            background-color: #ef4444;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .grid-config {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .card {
            background-color: #141b2d;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-save { background-color: #38bdf8; color: #0b0f19; margin-top: 10px; }
        .btn-save:hover { background-color: #0ea5e9; }
        .btn-start { background-color: #22c55e; color: white; margin-top: 15px; }
        .btn-start:hover { background-color: #16a34a; }
        .terminal-log {
            background-color: #05070f;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            height: 180px;
            overflow-y: auto;
            color: #34d399;
            margin-top: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h2>⚡ SISTEMA ESKAYLER MULTI-FILA TUS LLAVES NO SE ALMACENAN - SON TUYAS</h2>
        <div id="botStatus" class="status-badge">BOT APAGADO</div>
    </header>

    <div class="grid-config">
        <!-- Tarjeta de Configuración de API -->
        <div class="card">
            <h3>🔑 Conexión del Exchange</h3>
            <div class="form-group">
                <label>Seleccionar Exchange</label>
                <select id="exchange">
                    <option value="binance">Binance Spot</option>
                    <option value="bybit">Bybit Spot</option>
                </select>
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="Introduce tu clave API pública">
            </div>
            <div class="form-group">
                <label>API Secret</label>
                <input type="password" id="apiSecret" placeholder="Introduce tu clave secreta">
            </div>
            <button class="btn-action btn-save" onclick="guardarConfiguracion()">Guardar Llaves API</button>
        </div>

        <!-- Tarjeta de Control Operativo -->
        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h3>⚙️ Parámetros</h3>
                <div class="form-group">
                    <label>Monto Base por Fila</label>
                    <input type="text" value="$20.00 USD" disabled style="background-color: #0f172a; color: #64748b; text-align: center; font-weight: bold;">
                </div>
                <div class="form-group">
                    <label>Filas Activas</label>
                    <div style="font-size: 0.8rem; color: #38bdf8; background: #0f172a; padding: 8px; border-radius: 6px;">
                        BTC, BNB, ETH, SOL, TRX, HBAR, WLFI
                    </div>
                </div>
            </div>
            <button id="btnSwitch" class="btn-action btn-start" onclick="toggleBot()">ENCENDER MOTOR</button>
        </div>
    </div>

    <!-- Monitor de actividad en vivo -->
    <div class="card" style="margin-top: 20px;">
        <h3>📊 Monitor de Eventos en Tiempo Real</h3>
        <div id="terminal" class="terminal-log">
            [SISTEMA] Listo para iniciar. Por favor, introduce tus API Keys...
        </div>
    </div>
</div>

<script>
    let corriendo = false;

    // Conexión Javascript -> Python vía pywebview api
    function guardarConfiguracion() {
        const key = document.getElementById('apiKey').value;
        const secret = document.getElementById('apiSecret').value;
        const ex = document.getElementById('exchange').value;

        if(!key || !secret) {
            logTerminal("⚠️ Error: Los campos de API no pueden estar vacíos.");
            return;
        }

        // Llamada directa al Backend de Python definido en main.py
        window.pywebview.api.guardar_claves(key, secret, ex).then(function(response) {
            logTerminal(response);
        });
    }

    function toggleBot() {
        const btn = document.getElementById('btnSwitch');
        const badge = document.getElementById('botStatus');
        corriendo = !corriendo;

        if (corriendo) {
            btn.innerText = "DETENER BOT (STOP)";
            btn.style.backgroundColor = "#ef4444";
            badge.innerText = "BOT ACTIVO";
            badge.style.backgroundColor = "#22c55e";
            
            window.pywebview.api.alternar_bot(true).then(function(res) {
                logTerminal(res);
                logTerminal("📡 Escaneando mercados y organizando filas FIFO...");
            });
        } else {
            btn.innerText = "ENCENDER MOTOR";
            btn.style.backgroundColor = "#22c55e";
            badge.innerText = "BOT APAGADO";
            badge.style.backgroundColor = "#ef4444";
            
            window.pywebview.api.alternar_bot(false).then(function(res) {
                logTerminal(res);
            });
        }
    }

    function logTerminal(mensaje) {
        const term = document.getElementById('terminal');
        const timestamp = new Date().toLocaleTimeString();
        term.innerHTML += `<br>[${timestamp}] ${mensaje}`;
        term.scrollTop = term.scrollHeight; // Auto scroll hacia abajo
    }
</script>
</body>
</html>
